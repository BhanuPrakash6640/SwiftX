name: transformer_shakespeare_gpu
model:
  type: transformer
  d_model: 128
  n_layers: 4
  n_heads: 4
task:
  name: shakespeare
  seq_len: 256
train:
  batch_size: 16
  max_steps: 5000
  lr: 0.001
  min_lr: 0.0001
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_batches: 8
  seed: 0
  amp: true
  ckpt_every: 250
